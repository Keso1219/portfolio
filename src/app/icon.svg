<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Matte Charcoal Stone Tile -->
  <rect width="32" height="32" rx="7" fill="#161618"/>
  <!-- Hairline Nordic Blue Accent Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- Telemetry Dot in Nordic Blue -->
  <circle cx="25" cy="7" r="2.25" fill="#2563EB"/>
  <!-- KS Monogram in bone cream #F4F0EA Times New Roman -->
  <text x="16" y="21.5" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" fill="#F4F0EA" text-anchor="middle" letter-spacing="-0.5">KS</text>
</svg>